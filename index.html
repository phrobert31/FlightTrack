<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlightDeck — Personal Flight Log</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
:root{
  --ink:#0B1B33; --ink2:#3D4D66; --muted:#7A879B; --line:#E3E9F2;
  --bg:#F4F7FB; --card:#FFFFFF; --accent:#FF5A3C; --accent2:#FFE9E4;
  --sky:#1E6BF1; --sky2:#E8F0FE; --land:#E6ECF4; --landline:#D3DCE8;
  --visited:#CBDDF6; --ok:#0E9F6E;
  --ctl:#E9EEF6; --ctlon:#FFFFFF; --inbg:#FBFCFE; --chipbg:#F0F4F9; --ghost:#EDF1F7;
  --grab:#D8DFEA; --tabbg:rgba(255,255,255,.92); --pillbg:rgba(255,255,255,.92);
  --sphere:#EDF3FA; --mapline:#FFFFFF; --cname:#A9B6C6; --tipbg:#0B1B33; --tiptx:#FFFFFF; --tipsub:#B9C4D6;
  --r:16px; --shadow:0 1px 2px rgba(11,27,51,.06),0 8px 24px rgba(11,27,51,.07);
}
[data-theme="dark"]{
  --ink:#EDF2FA; --ink2:#C3CEDF; --muted:#7E8BA3; --line:#243250;
  --bg:#0C1424; --card:#16213A; --accent:#FF6A4D; --accent2:#43261F;
  --sky:#5E97FF; --sky2:#1D2F52; --land:#1C2A45; --landline:#2A3A5C;
  --visited:#223A5E; --ok:#2FBD85;
  --ctl:#1C2940; --ctlon:#2C3D5F; --inbg:#101B30; --chipbg:#1F2D49; --ghost:#22304C;
  --grab:#31425F; --tabbg:rgba(12,19,35,.92); --pillbg:rgba(20,30,52,.9);
  --sphere:#0F1A30; --mapline:#0B1322; --cname:#4E6182; --tipbg:#27344F; --tiptx:#F2F6FC; --tipsub:#ADBACF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);overscroll-behavior:none}
.mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
#app{display:flex;flex-direction:column;height:100dvh}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:10px;padding:12px 16px 8px;background:var(--bg);z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand svg{width:22px;height:22px;color:var(--accent)}
.spacer{flex:1}
.seg{display:flex;background:var(--ctl);border-radius:12px;padding:3px}
.seg button{padding:6px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ctlon);color:var(--ink);box-shadow:0 1px 3px rgba(11,27,51,.12)}
.unitbtn{padding:7px 12px;border-radius:12px;background:var(--ctl);font-size:13px;font-weight:700;color:var(--ink2);min-width:46px}

/* ---------- year chips ---------- */
.yearbar{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 10px;scrollbar-width:none}
.yearbar::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);
  font-size:13.5px;font-weight:600;color:var(--ink2);position:relative;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .dot{min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent2);color:var(--accent);
  font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.chip.on .dot{background:var(--accent);color:#fff}

/* ---------- main ---------- */
main{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;padding:4px 16px calc(86px + env(safe-area-inset-bottom));display:none}
.page.on{display:block}
#page-map{padding:0;overflow:hidden}

/* ---------- map ---------- */
#mapwrap{position:absolute;inset:0}
#mapsvg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#mapsvg:active{cursor:grabbing}
.map-overlay{position:absolute;top:10px;left:16px;right:16px;display:flex;gap:8px;pointer-events:none;flex-wrap:wrap}
.pill{pointer-events:auto;background:var(--pillbg);backdrop-filter:blur(8px);border:1px solid var(--line);
  border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--ink2);box-shadow:var(--shadow)}
.pill b{color:var(--ink);font-weight:800}
#tooltip{position:absolute;pointer-events:none;background:var(--tipbg);color:var(--tiptx);border-radius:10px;
  padding:8px 11px;font-size:12px;line-height:1.45;opacity:0;transition:opacity .12s;max-width:240px;z-index:20;box-shadow:var(--shadow)}
#tooltip .tt-route{font-weight:800;font-size:13px}
#tooltip .tt-sub{color:var(--tipsub)}
.mapbtns{position:absolute;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.mapbtns button{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  box-shadow:var(--shadow);font-size:18px;font-weight:700;color:var(--ink2)}

/* ---------- cards / stats ---------- */
.h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:14px 2px 10px}
.h1 small{font-size:13px;font-weight:600;color:var(--muted);margin-left:8px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05}
.hero .big small{font-size:17px;font-weight:700;color:var(--muted);margin-left:4px}
.hero .sub{color:var(--ink2);font-size:13.5px;margin-top:6px;line-height:1.5}
.hero .row{display:flex;gap:18px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.hero .row div{flex:1}
.kn{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.kl{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.stat .kn{font-size:26px}
.sect{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:18px 4px 8px}
.rowitem{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.rowitem:last-child{border-bottom:none}
.rt-code{font-weight:800;font-size:15px;letter-spacing:.02em}
.rt-sub{font-size:12px;color:var(--muted);margin-top:1px}
.rt-val{margin-left:auto;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.rt-val .rt-sub{font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--sky2);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--sky);border-radius:4px}
.yearrow{display:flex;align-items:center;gap:10px;padding:7px 2px;font-size:13px}
.yearrow .yl{width:42px;font-weight:700;color:var(--ink2)}
.yearrow .yv{width:34px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--accent2);color:var(--accent);
  font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.badge.blue{background:var(--sky2);color:var(--sky)}
.badge.gray{background:var(--ghost);color:var(--muted)}

/* ---------- flights list ---------- */
.fyear{display:flex;align-items:baseline;gap:10px;margin:18px 4px 8px}
.fyear .y{font-size:18px;font-weight:800}
.fyear .c{font-size:12.5px;color:var(--muted);font-weight:600}
.flight{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;
  box-shadow:var(--shadow);padding:13px 14px;margin-bottom:8px;width:100%;text-align:left}
.fl-codes{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;letter-spacing:.02em}
.fl-arrow{color:var(--accent);font-weight:400}
.fl-sub{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fl-right{margin-left:auto;text-align:right;flex-shrink:0}
.fl-dist{font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums}
.fl-month{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.fab{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:18px;
  background:var(--accent);color:#fff;font-size:26px;font-weight:300;box-shadow:0 6px 20px rgba(255,90,60,.4);z-index:6;display:flex;align-items:center;justify-content:center}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.empty b{color:var(--ink2)}

/* ---------- backfill deck ---------- */
.deckwrap{max-width:480px;margin:0 auto}
.progress{display:flex;align-items:center;gap:10px;margin:14px 2px 12px;font-size:12.5px;font-weight:700;color:var(--muted)}
.deckcard{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:22px 18px;position:relative}
.dc-route{display:flex;align-items:center;justify-content:center;gap:14px;font-size:30px;font-weight:800;letter-spacing:.02em;margin:6px 0 2px}
.dc-cities{text-align:center;color:var(--muted);font-size:13px;font-weight:600}
.dc-meta{text-align:center;margin-top:8px;font-size:12.5px;color:var(--ink2);display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.fieldlab{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 7px}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.months button{padding:9px 0;border-radius:11px;background:var(--chipbg);font-size:12.5px;font-weight:700;color:var(--ink2)}
.months button.on{background:var(--ink);color:#fff}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips button{padding:7px 12px;border-radius:999px;background:var(--chipbg);font-size:12.5px;font-weight:600;color:var(--ink2)}
.chips button.on{background:var(--ink);color:#fff}
.tin{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;background:var(--inbg)}
.tin:focus{outline:none;border-color:var(--sky)}
.deckbtns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:13px;border-radius:14px;font-size:14.5px;font-weight:700;text-align:center}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--ghost);color:var(--ink2)}
.btn.danger{background:#FDECEC;color:#D43030}
.btn:disabled{opacity:.4}
.bf-filter{display:flex;gap:7px;margin-bottom:4px}
.bf-filter button{padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink2)}
.bf-filter button.on{background:var(--sky);border-color:var(--sky);color:#fff}
.donedeck{text-align:center;padding:50px 20px;color:var(--muted)}
.donedeck .big{font-size:40px}

/* ---------- data page ---------- */
.dz{border:1.5px dashed var(--line);border-radius:14px;padding:14px;font-size:13px;color:var(--muted);
  text-align:center;margin-top:10px;background:var(--inbg)}
textarea.tin{min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12px}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--tabbg);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);padding:4px 0;border-radius:10px}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:22px;height:22px}

/* ---------- sheet / modal ---------- */
.sheetbg{position:fixed;inset:0;background:rgba(11,27,51,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheetbg.on{display:flex}
.sheet{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;
  padding:10px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:38px;height:4.5px;border-radius:3px;background:var(--grab);margin:4px auto 12px}
.sh-title{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.formrow{margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swapbtn{align-self:center;background:var(--chipbg);border-radius:10px;padding:8px 10px;font-size:14px}
.aphint{font-size:11.5px;color:var(--muted);margin-top:5px;min-height:14px}
.aphint.bad{color:#D43030}
.aphint.good{color:var(--ok)}
.acwrap{position:relative}
.aclist{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 10px 30px rgba(11,27,51,.16);z-index:30;overflow:hidden;max-height:264px;overflow-y:auto}
.aclist button{display:block;width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
.aclist button:last-child{border-bottom:none}
.aclist button:active{background:var(--sky2)}
.aclist .ac-main{font-weight:700}
.aclist .ac-main .mono{color:var(--sky)}
.aclist .ac-sub{font-size:11.5px;color:var(--muted);margin-top:1px}
@media(min-width:740px){
  .page{padding-left:max(16px,calc(50vw - 350px));padding-right:max(16px,calc(50vw - 350px))}
  .grid2{grid-template-columns:repeat(4,1fr)}
  .sheetbg{align-items:center}
  .sheet{border-radius:22px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 15.5l-8-4.7V4.2c0-.9-.7-1.7-1.5-1.7s-1.5.8-1.5 1.7v6.6l-8 4.7v2.1l8-2.5v5l-2.3 1.7v1.7l3.8-1.1 3.8 1.1v-1.7L13.5 20v-5l8 2.5v-2z"/></svg>FlightDeck</div>
  <div class="spacer"></div>
  <div class="seg" id="viewseg">
    <button data-v="map2d" class="on">Map</button>
    <button data-v="globe">Globe</button>
  </div>
  <button class="unitbtn" id="unitbtn">km</button>
  <button class="unitbtn" id="themebtn" aria-label="Theme" style="min-width:38px;padding:7px 9px">☾</button>
</header>
<div class="yearbar" id="yearbar"></div>
<main>
  <div class="page on" id="page-map">
    <div id="mapwrap">
      <svg id="mapsvg"></svg>
      <div class="map-overlay" id="mapsummary"></div>
      <div class="mapbtns">
        <button id="zin">+</button>
        <button id="zout">−</button>
        <button id="zreset" style="font-size:13px">⌂</button>
      </div>
      <div id="tooltip"></div>
    </div>
  </div>
  <div class="page" id="page-stats"></div>
  <div class="page" id="page-flights"></div>
  <div class="page" id="page-backfill"></div>
  <div class="page" id="page-data"></div>
</main>
<nav class="tabbar" id="tabbar">
  <button data-t="map" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3.5 9h17M3.5 15h17M12 3a15 15 0 010 18M12 3a15 15 0 000 18"/></svg>Map</button>
  <button data-t="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Passport</button>
  <button data-t="flights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Flights</button>
  <button data-t="backfill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="13" height="16" rx="2.5"/><path d="M16 7l3.2-1.2a2 2 0 012.5 1.2l.1.4"/></svg>Backfill</button>
  <button data-t="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5V18c0 1.7 3.6 3 8 3s8-1.3 8-3V5.5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>Data</button>
</nav>
</div>
<div class="sheetbg" id="sheetbg"><div class="sheet" id="sheet"></div></div>

let customAirports = {};                              // user-added
const ap = c => AP[c] || customAirports[c];
function searchAp(q){
  q = q.trim().toLowerCase(); if(q.length < 2) return [];
  const res = [];
  const all = [...Object.values(customAirports), ...AIRPORTS_RAW];
  for(const a of all){
    const city=(a[3]||'').toLowerCase(), name=(a[5]||'').toLowerCase(), co=(a[4]||'').toLowerCase();
    let sc = -1;
    if(a[0].toLowerCase() === q) sc = 0;
    else if(city.startsWith(q)) sc = 1;
    else if(name.startsWith(q)) sc = 2;
    else if(name.includes(q)) sc = 3;
    else if(city.includes(q)) sc = 4;
    else if(co.startsWith(q)) sc = 5;
    if(sc >= 0) res.push([sc, a]);
    }
  return res.sort((x,y)=>x[0]-y[0]).slice(0,8).map(x=>x[1]);
}

/* ---------------- persistence ---------------- */
function persist(){
  try{ localStorage.setItem('flightdeck_v2', JSON.stringify({flights, customAirports, unit, theme})); storageOK = true; }
  catch(e){ storageOK = false; }
}
function restore(){
  try{
    const s = localStorage.getItem('flightdeck_v2');
    if(s){ const d = JSON.parse(s); flights = d.flights||[]; customAirports = d.customAirports||{}; unit = d.unit||'km'; theme = d.theme||'light'; storageOK = true; return true; }
    storageOK = true;
  }catch(e){ storageOK = false; }
  return false;
}
if(!restore()) flights = SEED.map(f => ({...f}));   // seed only when no saved state exists

/* ---------------- math & formatting ---------------- */
const R = 6371;
function distKm(f){
  const a = ap(f.from), b = ap(f.to);
  if(!a || !b) return 0;
  const toR = x => x*Math.PI/180;
  const dLat = toR(b[1]-a[1]), dLon = toR(b[2]-a[2]);
  const h = Math.sin(dLat/2)**2 + Math.cos(toR(a[1]))*Math.cos(toR(b[1]))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const UNITS = {km:{f:1,l:'km'}, mi:{f:0.621371,l:'mi'}, nm:{f:0.539957,l:'nm'}};
const conv = km => km * UNITS[unit].f;
const fmtN = n => Math.round(n).toLocaleString('en-US');
const fmtDist = km => fmtN(conv(km)) + ' ' + UNITS[unit].l;
const estH = km => km > 0 ? 0.5 + (km*0.621371)/500 : 0;   // OpenFlights approximation
function fmtH(h){
  const H = Math.floor(h), M = Math.round((h-H)*60);
  return H >= 100 ? fmtN(H)+' h' : H+'h '+(M<10?'0':'')+M+'m';
}
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const scoped = () => yearSel==='all' ? flights : flights.filter(f => f.year === yearSel);
const yearsList = () => [...new Set(flights.map(f=>f.year))].sort((a,b)=>a-b);
function sortKey(f){ return f.year*10000 + (f.month||13)*100; }
function firstTypeIds(){
  const m = {};
  for(const f of [...flights].sort((a,b)=>sortKey(a)-sortKey(b))){
    const t = (f.type||'').trim().toLowerCase();
    if(t && !(t in m)) m[t] = f.id;
  }
  return new Set(Object.values(m));
}
function airlinesKnown(){ return [...new Set(flights.map(f=>f.airline).filter(Boolean))].sort(); }
function typesKnown(){ return [...new Set([...flights.map(f=>f.type).filter(Boolean), ...AC_QUICK])]; }

/* ---------------- summary for a flight set ---------------- */
function summarize(set){
  let km=0, h=0; const aps=new Set(), cos=new Set(), als=new Set(), tys=new Set();
  let longest=null, shortest=null;
  const routes={};
  for(const f of set){
    const d = distKm(f); km += d; h += estH(d);
    const a=ap(f.from), b=ap(f.to);
    if(a){aps.add(f.from);cos.add(a[4]);} if(b){aps.add(f.to);cos.add(b[4]);}
    if(f.airline) als.add(f.airline.trim());
    if(f.type) tys.add(f.type.trim().toLowerCase());
    if(d>0){ if(!longest||d>longest.d) longest={f,d}; if(!shortest||d<shortest.d) shortest={f,d}; }
    const k=[f.from,f.to].sort().join('–');
    routes[k]=(routes[k]||0)+1;
  }
  const topRoutes = Object.entries(routes).sort((x,y)=>y[1]-x[1]).slice(0,5);
  return {n:set.length, km, h, airports:aps.size, countries:cos.size, airlines:als.size, types:tys.size, longest, shortest, topRoutes};
}

const land = topojson.feature(WORLD, WORLD.objects.countries);
/* repair polygon winding (antimeridian countries arrive inverted → antipodal centroids/areas) */
(function rewind(){
  const ringA = r => d3.geoArea({type:'Polygon', coordinates:[r]});
  for(const f of land.features){
    const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
    for(const rings of polys){
      if(ringA(rings[0]) > 2*Math.PI) rings[0].reverse();
      for(let i=1; i<rings.length; i++) if(ringA(rings[i]) < 2*Math.PI) rings[i].reverse();
    }
  }
})();

/* label anchor = centroid of each country's largest polygon (avoids overseas-territory drift) */
const labelPts = land.features.map(f => {
  const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
  let best = null, bestA = -1;
  for(const c of polys){ const g = {type:'Polygon', coordinates:c}; const a = d3.geoArea(g);
    if(a > bestA){ bestA = a; best = g; } }
  return {name: f.properties.name, lonlat: d3.geoCentroid(best), geoA: d3.geoArea(f)};
});

/* airport DB country name → Natural Earth map name */
const NE_ALIAS = {'United States':'United States of America','Czech Republic':'Czechia',
  'Dominican Republic':'Dominican Rep.','Bosnia and Herzegovina':'Bosnia and Herz.',
  'Burma':'Myanmar','Hong Kong':'China','Macau':'China','East Timor':'Timor-Leste',
  'Congo (Kinshasa)':'Dem. Rep. Congo','Congo (Brazzaville)':'Congo','South Sudan':'S. Sudan',
  'Central African Republic':'Central African Rep.','Equatorial Guinea':'Eq. Guinea',
  'Solomon Islands':'Solomon Is.','Cape Verde':'Cabo Verde','Ivory Coast':"Côte d'Ivoire"};
const NE_NAMES = new Set(land.features.map(f => f.properties.name));
const landByArea = [...land.features].sort((a,b) => d3.geoArea(a) - d3.geoArea(b));

function countryOf(code){
  if(code in visitedCache) return visitedCache[code];
  const a = ap(code); let res = null;
  if(a){
    const db = a[4];                              // database country = source of truth
    if(db){ const ne = NE_ALIAS[db] || db; if(NE_NAMES.has(ne)) res = ne; }
    if(!res){                                     // fallback: geometry, smallest country first
      const pt = [a[2], a[1]];
      for(const f of landByArea){ if(d3.geoContains(f, pt)){ res = f.properties.name; break; } }
    }
  }
  visitedCache[code] = res; return res;
}
function visitedCountrySet(set){
  const s = new Set();
  for(const f of set){ const c1=countryOf(f.from), c2=countryOf(f.to); if(c1)s.add(c1); if(c2)s.add(c2); }
  return s;
}
function mapSize(){ const w = document.getElementById('mapwrap'); return [w.clientWidth, w.clientHeight]; }

function setupProjection(){
  const [w,h] = mapSize();
  if(mapMode === 'map2d'){
    proj = d3.geoNaturalEarth1().fitExtent([[8,8],[w-8,h-8]], {type:'Sphere'});
  }else{
    proj = d3.geoOrthographic().rotate(globeRot)
      .fitExtent([[14,14],[w-14,h-14]], {type:'Sphere'}).clipAngle(90);
  }
  proj.baseScale = proj.scale();
  path = d3.geoPath(proj);
}

function routeAgg(set){
  const m = {};
  for(const f of set){
    const a=ap(f.from), b=ap(f.to); if(!a||!b||f.from===f.to) continue;
    const k=[f.from,f.to].sort().join('-');
    if(!m[k]) m[k]={key:k, a:[a[2],a[1]], b:[b[2],b[1]], c1:f.from<f.to?f.from:f.to, c2:f.from<f.to?f.to:f.from, n:0, km:distKm(f), fl:[]};
    m[k].n++; m[k].fl.push(f);
  }
  return Object.values(m);
}
function aptAgg(set){
  const m = {};
  for(const f of set) for(const c of [f.from,f.to]){
    const a=ap(c); if(!a) continue;
    if(!m[c]) m[c]={code:c, lonlat:[a[2],a[1]], city:a[3], country:a[4], name:a[5]||'', n:0};
    m[c].n++;
  }
  return Object.values(m);
}

function hideTip(){ tooltip.style.opacity = 0; }
function evtXY(e){
  const r = document.getElementById('mapwrap').getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}
function routeTip(d){
  const list = [...d.fl].sort((x,y)=>sortKey(x)-sortKey(y))
    .map(f => `<span class="mono">${f.from}→${f.to}</span> ${f.year}${f.month?' '+MONTHS[f.month-1]:''}`);
  const shown = list.slice(0,6).join('<br>') + (list.length>6 ? `<br>+${list.length-6} more` : '');
  return `<div class="tt-route mono">${d.c1} ↔ ${d.c2}</div>
    <div class="tt-sub">${d.n} flight${d.n>1?'s':''} · ${fmtDist(d.km)} each way</div>
    <div class="tt-sub" style="margin-top:5px">${shown}</div>`;
}
function aptTip(d){
  return `<div class="tt-route"><span class="mono">${d.code}</span> · ${esc(d.city)}</div>
    <div class="tt-sub">${d.name&&d.name!==d.city?esc(d.name)+' · ':''}${esc(d.country)} · ${d.n} visit${d.n>1?'s':''}</div>`;
}

/* ----- selection styling ----- */
const arcW = d => Math.min(1.4 + Math.log2(d.n+1)*0.9, 4.5) / curK;
const aptR = d => Math.min(2.6 + Math.sqrt(d.n)*1.1, 7) / curK;
function isSel(kind, key){ return sel && sel.kind===kind && sel.key===key; }
function restyleSel(){
  gArcs.selectAll('.arc')
    .style('stroke', d => isSel('route',d.key) ? 'var(--sky)' : 'var(--accent)')
    .style('stroke-opacity', d => isSel('route',d.key) ? 1 : (sel ? 0.35 : 0.6))
    .style('stroke-width', d => arcW(d) * (isSel('route',d.key) ? 1.8 : 1));
  gApts.selectAll('.apt')
    .style('fill', d => isSel('apt',d.code) ? 'var(--sky)' : 'var(--ink)');
}
function clearSel(){ if(sel){ sel = null; hideTip(); restyleSel(); } }

function drawMap(animate){
  setupProjection();
  if(mapMode === 'map2d'){
    const t = d3.zoomTransform(svg.node());
    curK = t.k; gRoot.attr('transform', t.k !== 1 || t.x || t.y ? t.toString() : null);
  } else {
    curK = 1; gRoot.attr('transform', null);
  }
  sel = null; hideTip();
  const set = scoped();
  const visited = visitedCountrySet(set);

  gLand.selectAll('*').remove();
  gLand.append('path').attr('class','sphere').attr('d', path({type:'Sphere'}))
    .style('fill', mapMode==='globe' ? 'var(--sphere)' : 'none')
    .style('stroke', mapMode==='globe' ? 'var(--landline)' : 'none').style('stroke-width',1);
  gLand.selectAll('.country').data(land.features).join('path')
    .attr('class','country')
    .attr('d', path)
    .style('fill', d => visited.has(d.properties.name) ? 'var(--visited)' : 'var(--land)')
    .style('stroke', 'var(--mapline)').style('stroke-width', 0.8/curK);

  gLabels.selectAll('*').remove();
  gLabels.selectAll('text').data(labelPts).join('text')
    .attr('class','cname')
    .attr('text-anchor','middle')
    .style('fill','var(--cname)')
    .attr('font-weight',600)
    .attr('pointer-events','none')
    .text(d => d.name);
  updateLabels();

  const arcs = routeAgg(set);
  gArcs.selectAll('*').remove();
  gArcs.selectAll('.arc').data(arcs).join('path')
    .attr('class','arc')
    .attr('d', d => path({type:'LineString', coordinates:[d.a, d.b]}))
    .style('fill','none')
    .style('stroke','var(--accent)')
    .style('stroke-opacity',0.6)
    .style('stroke-width', arcW)
    .attr('stroke-linecap','round')
    .style('cursor','pointer')
    .on('click', function(e,d){
      e.stopPropagation();
      sel = isSel('route',d.key) ? null : {kind:'route', key:d.key};
      restyleSel();
      if(sel){ const [x,y]=evtXY(e); showTip(routeTip(d), x, y); } else hideTip();
    })
    .on('pointerenter', function(e,d){ if(!sel){ const [x,y]=evtXY(e); showTip(routeTip(d), x, y); } })
    .on('pointerleave', function(){ if(!sel) hideTip(); });

  if(animate && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    gArcs.selectAll('.arc').each(function(){
      const L = this.getTotalLength();
      d3.select(this).attr('stroke-dasharray', L+' '+L).attr('stroke-dashoffset', L)
        .transition().duration(800).ease(d3.easeCubicOut).attr('stroke-dashoffset', 0)
        .on('end', function(){ d3.select(this).attr('stroke-dasharray', null); });
    });
  }

  const apts = aptAgg(set);
  gApts.selectAll('*').remove();
  gApts.selectAll('.apt').data(apts).join('path')
    .attr('class','apt')
    .attr('d', d => { path.pointRadius(aptR(d)); return path({type:'Point', coordinates:d.lonlat}); })
    .style('fill','var(--ink)').style('stroke','var(--card)')
    .style('stroke-width', 1.4/curK)
    .style('cursor','pointer')
    .on('click', function(e,d){
      e.stopPropagation();
      sel = isSel('apt',d.code) ? null : {kind:'apt', key:d.code};
      restyleSel();
      if(sel){ const [x,y]=evtXY(e); showTip(aptTip(d), x, y); } else hideTip();
    })
    .on('pointerenter', function(e,d){ if(!sel){ const [x,y]=evtXY(e); showTip(aptTip(d), x, y); } })
    .on('pointerleave', function(){ if(!sel) hideTip(); });

  svg.on('click', clearSel);

  const s = summarize(set);
  const unalloc = set.filter(f=>!f.month).length;
  document.getElementById('mapsummary').innerHTML =
    `<div class="pill"><b>${s.n}</b> flights · <b>${fmtDist(s.km)}</b></div>` +
    (unalloc ? `<div class="pill" style="color:var(--accent)"><b>${unalloc}</b> without month</div>` : '');
}

/* ----- country name labels ----- */
function updateLabels(){
  const S2 = mapMode === 'map2d' ? (proj.scale()*curK)**2 : proj.scale()**2;
  const center = mapMode === 'globe' ? [-globeRot[0], -globeRot[1]] : null;
  const [vw,vh] = mapSize();
  const TH = Math.max(3000, vw*vh*0.018);   // country must take a real chunk of the screen
  gLabels.selectAll('.cname')
    .attr('font-size', mapMode === 'map2d' ? 11/curK : 11)
    .each(function(d){
      let show = d.geoA * S2 * 1.2 > TH;
      if(show && center && d3.geoDistance(d.lonlat, center) > 1.45) show = false;
      const p = show ? proj(d.lonlat) : null;
      if(p){ this.setAttribute('x', p[0]); this.setAttribute('y', p[1]); this.removeAttribute('display'); }
      else this.setAttribute('display','none');
    });
}

/* ----- zoom / pan / rotate ----- */
function applyStrokeScale(){
  gLand.selectAll('.country').style('stroke-width', 0.8/curK);
  gArcs.selectAll('.arc').style('stroke-width', d => arcW(d) * (isSel('route',d.key) ? 1.8 : 1));
  gApts.selectAll('.apt').attr('d', d => { path.pointRadius(aptR(d));
    return path({type:'Point', coordinates:d.lonlat}); }).style('stroke-width', 1.4/curK);
}
function bindMapInteractions(){
  svg.on('.zoom', null).on('.drag', null);
  if(mapMode === 'map2d'){
    zoomBehavior = d3.zoom().scaleExtent([1, 48]).on('zoom', e => {
      curK = e.transform.k;
      gRoot.attr('transform', e.transform);
      applyStrokeScale();
      updateLabels();
    });
    svg.call(zoomBehavior);
  } else {
    gRoot.attr('transform', null); curK = 1;
    let raf = null;
    const rerender = () => { raf = null;
      gLand.selectAll('.country').attr('d', path);
      gLand.select('.sphere').attr('d', path({type:'Sphere'}));
      gArcs.selectAll('.arc').attr('d', d => path({type:'LineString', coordinates:[d.a,d.b]}));
      gApts.selectAll('.apt').attr('d', d => { path.pointRadius(aptR(d));
        return path({type:'Point', coordinates:d.lonlat}); });
      updateLabels();
    };
    const queue = () => { if(!raf) raf = requestAnimationFrame(rerender); };
    let lastT = d3.zoomIdentity;
    zoomBehavior = d3.zoom().scaleExtent([0.8, 16]).on('zoom', e => {
      const t = e.transform;
      const dk = Math.abs(t.k - lastT.k);
      proj.scale(proj.baseScale * t.k);
      if(e.sourceEvent && dk < 1e-9){
        const sens = 90 / proj.scale();
        globeRot = [globeRot[0] + (t.x - lastT.x) * sens,
                    Math.max(-90, Math.min(90, globeRot[1] - (t.y - lastT.y) * sens))];
        proj.rotate(globeRot);
      }
      lastT = t; queue();
    });
    svg.call(zoomBehavior).on('dblclick.zoom', null);
  }
}
document.getElementById('zin').onclick = () => svg.transition().duration(200).call(zoomBehavior.scaleBy, 1.5);
document.getElementById('zout').onclick = () => svg.transition().duration(200).call(zoomBehavior.scaleBy, 1/1.5);
document.getElementById('zreset').onclick = () => { svg.transition().duration(250).call(zoomBehavior.transform, d3.zoomIdentity); };
function resetZoomState(){ svg.node().__zoom = d3.zoomIdentity; gRoot.attr('transform', null); curK = 1; }
window.addEventListener('resize', () => { if(tab==='map'){ drawMap(false); bindMapInteractions(); } });
/* ================= STATS (PASSPORT) ================= */
const EARTH_C = 40075, MOON = 384400;
function renderStats(){
  const set = scoped(), s = summarize(set);
  const scopeLabel = yearSel==='all' ? 'All time' : yearSel;
  let html = `<div class="h1">Passport <small>${scopeLabel}</small></div>`;
  if(!set.length){ document.getElementById('page-stats').innerHTML = html +
    `<div class="empty"><b>No flights in this scope.</b><br>Pick another year.</div>`; return; }

  const around = s.km / EARTH_C, toMoon = s.km / MOON * 100;
  const days = s.h / 24;
  html += `<div class="card hero">
    <div class="big">${fmtN(conv(s.km))}<small>${UNITS[unit].l}</small></div>
    <div class="sub">≈ ${around>=0.1?around.toFixed(1):around.toFixed(2)}× around the Earth · ${toMoon.toFixed(1)}% of the way to the Moon</div>
    <div class="row">
      <div><div class="kn">${s.n}</div><div class="kl">Flights</div></div>
      <div><div class="kn">${fmtH(s.h)}</div><div class="kl">Est. in air${days>=1?' · '+days.toFixed(1)+'d':''}</div></div>
      <div><div class="kn">${s.n?fmtN(conv(s.km/s.n)):0}</div><div class="kl">Avg ${UNITS[unit].l}</div></div>
    </div>
  </div>
  <div class="grid2">
    <div class="card stat"><div class="kn">${s.airports}</div><div class="kl">Airports</div></div>
    <div class="card stat"><div class="kn">${s.countries}</div><div class="kl">Countries</div></div>
    <div class="card stat"><div class="kn">${s.airlines}</div><div class="kl">Airlines</div></div>
    <div class="card stat"><div class="kn">${s.types}</div><div class="kl">Aircraft types</div></div>
  </div>`;

  /* ---- aggregations ---- */
  const count = (arr, key) => {
    const m = {};
    for(const x of arr){ const k = key(x); if(k==null||k==='') continue;
      m[k] = (m[k]||0) + 1; }
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);
  };
  const sumBy = (arr, key, val) => {
    const m = {};
    for(const x of arr){ const k = key(x); if(k==null||k==='') continue;
      m[k] = (m[k]||0) + val(x); }
    return m;
  };
  const fr = f => `<span class="mono">${f.from} → ${f.to}</span>`;
  const when = f => f.year + (f.month ? ' ' + MONTHS[f.month-1] : '');

  const airlines = count(set, f => f.airline.trim() || null);
  const airlineKm = sumBy(set, f => f.airline.trim() || null, distKm);
  const types = count(set, f => (f.type||'').trim() || null);
  const aptVisits = count(set.flatMap(f => [f.from, f.to]), c => c);
  const coVisits = count(set.flatMap(f => [f.from, f.to]), c => (ap(c)||[])[4]);
  const domestic = set.filter(f => ap(f.from) && ap(f.to) && ap(f.from)[4] === ap(f.to)[4]).length;
  const perYearAll = yearsList().map(y => {
    const yf = flights.filter(f => f.year === y);
    return {y, n: yf.length, km: yf.reduce((a,f)=>a+distKm(f),0)};
  });
  const busiest = [...perYearAll].sort((a,b)=>b.n-a.n)[0];
  // first visit year per airport → exploration
  const firstVisit = {};
  for(const f of [...flights].sort((a,b)=>sortKey(a)-sortKey(b)))
    for(const c of [f.from, f.to]) if(!(c in firstVisit)) firstVisit[c] = f.year;
  const newApts = set.flatMap(f=>[f.from,f.to]).filter((c,i,arr)=>arr.indexOf(c)===i && (yearSel==='all' || firstVisit[c]===yearSel)).length;

  /* ---- records ---- */
  const rec = [];
  if(s.topRoutes.length){ const [k,n] = s.topRoutes[0];
    rec.push(['Most flown route', `<span class="mono">${k.replace('–',' ↔ ')}</span>`, n + ' flights']); }
  if(airlines.length) rec.push(['Most flown airline', esc(airlines[0][0]),
    airlines[0][1] + ' flights · ' + fmtDist(airlineKm[airlines[0][0]])]);
  if(types.length) rec.push(['Most flown aircraft', esc(types[0][0]), types[0][1] + ' flights']);
  if(aptVisits.length){ const [c,n] = aptVisits[0]; const a = ap(c);
    rec.push(['Home airport', `<span class="mono">${c}</span> ${a?esc(a[3]):''}`, n + ' visits']); }
  if(coVisits.length) rec.push(['Top country', esc(coVisits[0][0]), coVisits[0][1] + ' airport visits']);
  if(yearSel==='all' && busiest) rec.push(['Busiest year', busiest.y, busiest.n + ' flights · ' + fmtDist(busiest.km)]);
  if(s.longest) rec.push(['Longest flight', fr(s.longest.f) + ' · ' + when(s.longest.f),
    fmtDist(s.longest.d) + ' · ' + fmtH(estH(s.longest.d))]);
  if(s.shortest) rec.push(['Shortest flight', fr(s.shortest.f) + ' · ' + when(s.shortest.f),
    fmtDist(s.shortest.d) + ' · ' + fmtH(estH(s.shortest.d))]);
  rec.push(['Domestic flights', domestic || 'None', domestic ? 'same-country legs' : '']);
  if(newApts) rec.push(['New airports' + (yearSel==='all'?'':' in '+yearSel), newApts, 'first-time visits']);
  html += `<div class="sect">Records</div><div class="card">` + rec.map(([l,v,sub]) =>
    `<div class="rowitem"><div style="min-width:0"><div class="rt-sub" style="margin:0 0 2px">${l}</div>
      <div class="rt-code">${v}</div></div><div class="rt-val"><div class="rt-sub">${sub}</div></div></div>`).join('') + `</div>`;

  /* ---- top routes ---- */
  if(s.topRoutes.length){
    const max = s.topRoutes[0][1];
    html += `<div class="sect">Top routes</div><div class="card">` + s.topRoutes.map(([k,n]) => {
      const [c1,c2] = k.split('–');
      const oneWay = ap(c1)&&ap(c2) ? distKm({from:c1,to:c2}) : 0;
      return `<div class="rowitem"><div class="rt-code mono" style="min-width:96px">${k.replace('–',' ↔ ')}</div>
       <div class="bar"><i style="width:${n/max*100}%"></i></div>
       <div class="rt-val">${n}×<div class="rt-sub">${fmtDist(oneWay*n)}</div></div></div>`; }).join('') + `</div>`;
  }

  /* ---- airlines leaderboard ---- */
  if(airlines.length){
    const max = airlines[0][1];
    html += `<div class="sect">Airlines</div><div class="card">` + airlines.slice(0,8).map(([al,n]) =>
      `<div class="rowitem"><div style="min-width:86px;font-weight:700;font-size:13.5px">${esc(al)}</div>
       <div class="bar"><i style="width:${n/max*100}%"></i></div>
       <div class="rt-val">${n}×<div class="rt-sub">${fmtDist(airlineKm[al])}</div></div></div>`).join('')
      + (set.some(f=>!f.airline.trim()) ? `<div class="rt-sub" style="padding-top:8px">${set.filter(f=>!f.airline.trim()).length} flights without airline yet — Backfill awaits</div>` : '') + `</div>`;
  }

  /* ---- airports leaderboard ---- */
  if(aptVisits.length){
    const max = aptVisits[0][1];
    html += `<div class="sect">Airports</div><div class="card">` + aptVisits.slice(0,8).map(([c,n]) => {
      const a = ap(c);
      return `<div class="rowitem"><div style="min-width:86px"><span class="rt-code mono">${c}</span>
        <div class="rt-sub">${a?esc(a[3]):''}</div></div>
       <div class="bar"><i style="width:${n/max*100}%"></i></div><div class="rt-val">${n}×</div></div>`; }).join('') + `</div>`;
  }

  /* ---- countries ---- */
  if(coVisits.length){
    html += `<div class="sect">Countries · ${coVisits.length}</div><div class="card"><div class="chips">` +
      coVisits.map(([c,n]) => `<button style="pointer-events:none">${esc(c)} · ${n}</button>`).join('') + `</div></div>`;
  }

  /* ---- fleet ---- */
  const fleet = {};
  for(const f of [...set].sort((a,b)=>sortKey(a)-sortKey(b))){ const t=(f.type||'').trim(); if(!t) continue;
    const k=t.toLowerCase(); if(!fleet[k]) fleet[k]={label:t,n:0,first:f.year}; fleet[k].n++; }
  const fleetArr = Object.values(fleet).sort((a,b)=>b.n-a.n);
  if(fleetArr.length){
    html += `<div class="sect">Fleet</div><div class="card">` + fleetArr.map(t =>
      `<div class="rowitem"><div><div class="rt-code">${esc(t.label)}</div><div class="rt-sub">First flown ${t.first}</div></div>
       <div class="rt-val">${t.n}×</div></div>`).join('') + `</div>`;
  }

  /* ---- per-year charts (always all-time) ---- */
  if(perYearAll.length > 1){
    const mx = Math.max(...perYearAll.map(d=>d.n));
    html += `<div class="sect">Flights per year</div><div class="card">` + perYearAll.map(d =>
      `<div class="yearrow"><div class="yl">${d.y}</div><div class="bar"><i style="width:${d.n/mx*100}%"></i></div><div class="yv">${d.n}</div></div>`).join('') + `</div>`;
    const mk = Math.max(...perYearAll.map(d=>d.km));
    html += `<div class="sect">Distance per year</div><div class="card">` + perYearAll.map(d =>
      `<div class="yearrow"><div class="yl">${d.y}</div><div class="bar"><i style="width:${d.km/mk*100}%;background:var(--accent)"></i></div>
       <div class="yv" style="width:64px">${fmtN(conv(d.km))}</div></div>`).join('') +
      `<div class="rt-sub" style="padding-top:6px;text-align:right">${UNITS[unit].l}</div></div>`;
  }

  /* ---- months (only once backfilled) ---- */
  const withM = set.filter(f=>f.month);
  if(withM.length){
    const mc = Array(12).fill(0); for(const f of withM) mc[f.month-1]++;
    const mm = Math.max(...mc);
    html += `<div class="sect">By month · ${withM.length} of ${set.length} dated</div><div class="card">` +
      MONTHS.map((m,i) => `<div class="yearrow"><div class="yl">${m}</div>
        <div class="bar"><i style="width:${mm?mc[i]/mm*100:0}%"></i></div><div class="yv">${mc[i]||''}</div></div>`).join('') + `</div>`;
  }

  /* ---- class (only once filled) ---- */
  const clsC = count(set, f => f.cls || null);
  if(clsC.length){
    html += `<div class="sect">Cabin</div><div class="card">` + clsC.map(([c,n]) =>
      `<div class="rowitem"><div class="rt-code">${esc(c)}</div><div class="rt-val">${n}×</div></div>`).join('') + `</div>`;
  }

  html += `<div style="text-align:center;color:var(--muted);font-size:11.5px;padding:6px 0 14px">Flight time estimated as 30 min + distance at ~500 mph</div>`;
  document.getElementById('page-stats').innerHTML = html;
}

/* ================= FLIGHTS LIST ================= */
function flightRow(f, ftIds){
  const a=ap(f.from), b=ap(f.to), d=distKm(f);
  const sub = [f.airline, f.type].filter(Boolean).map(esc).join(' · ');
  const cities = a&&b ? `${esc(a[3])} → ${esc(b[3])}` : '<span style="color:#D43030">Unknown airport</span>';
  return `<button class="flight" onclick="openEditor('${f.id}')">
    <div>
      <div class="fl-codes mono">${f.from} <span class="fl-arrow">→</span> ${f.to}
        ${ftIds.has(f.id)?'<span class="badge">1st on type</span>':''}
        ${f.demo?'<span class="badge gray">demo</span>':''}</div>
      <div class="fl-sub">${cities}${sub?' · '+sub:''}</div>
    </div>
    <div class="fl-right">
      <div class="fl-dist">${d?fmtDist(d):'—'}</div>
      <div class="fl-month">${f.month ? MONTHS[f.month-1] : '<span style="color:var(--accent);font-weight:700">month?</span>'}</div>
    </div>
  </button>`;
}
function renderFlights(){
  const ftIds = firstTypeIds();
  const ys = yearsList().reverse().filter(y => yearSel==='all' || y===yearSel);
  let html = `<div class="h1">Flights <small>${flights.length} total</small></div>`;
  if(!flights.length) html += `<div class="empty"><b>No flights yet.</b><br>Tap + to add your first flight, or import your list from the Data tab.</div>`;
  for(const y of ys){
    const yf = flights.filter(f=>f.year===y);
    const withM = yf.filter(f=>f.month).sort((a,b)=>a.month-b.month);
    const noM = yf.filter(f=>!f.month);
    html += `<div class="fyear"><div class="y">${y}</div><div class="c">${yf.length} flight${yf.length>1?'s':''}${noM.length?` · <span style="color:var(--accent)">${noM.length} without month</span>`:''}</div></div>`;
    html += withM.map(f=>flightRow(f,ftIds)).join('');
    if(noM.length){
      if(withM.length) html += `<div class="sect" style="margin-top:10px">Month not set</div>`;
      html += noM.map(f=>flightRow(f,ftIds)).join('');
    }
  }
  html += `<button class="fab" onclick="openAdd()">+</button>`;
  document.getElementById('page-flights').innerHTML = html;
}
/* ================= BACKFILL DECK (unified card) ================= */
const bfMissing = f => !f.month || !(f.type||'').trim() || !(f.airline||'').trim();
function bfQueue(){ return scoped().filter(bfMissing).sort((a,b)=>sortKey(a)-sortKey(b)); }
let bfDraft = null, bfDraftId = null;

function renderBackfill(){
  const q = bfQueue();
  if(bfIdx >= q.length) bfIdx = Math.max(0, q.length - 1);
  let html = `<div class="h1">Backfill <small>month · airline · aircraft</small></div>`;
  if(!q.length){
    html += `<div class="donedeck"><div class="big">✓</div><br><b style="color:var(--ink)">All caught up.</b><br>Every flight${yearSel!=='all'?' in '+yearSel:''} has month, airline and aircraft set.</div>`;
    document.getElementById('page-backfill').innerHTML = html;
    bfDraft = null; bfDraftId = null; return;
  }
  const f = q[bfIdx];
  if(bfDraftId !== f.id){ bfDraft = {month:f.month||null, airline:f.airline||'', type:f.type||''}; bfDraftId = f.id; }
  const a = ap(f.from), b = ap(f.to), d = distKm(f);
  const knownAls = airlinesKnown();

  html += `<div class="deckwrap">
  <div class="progress"><div style="white-space:nowrap">${bfIdx+1} of ${q.length}</div>
    <div class="bar" style="height:5px"><i style="width:${bfIdx/q.length*100}%"></i></div></div>
  <div class="deckcard">
    <div style="text-align:center"><span class="badge blue">${f.year}</span></div>
    <div class="dc-route mono">${f.from} <span style="color:var(--accent)">→</span> ${f.to}</div>
    <div class="dc-cities">${a?esc(a[3])+', '+esc(a[4]):'?'} → ${b?esc(b[3])+', '+esc(b[4]):'?'}</div>
    <div class="dc-meta">${d?'<span>'+fmtDist(d)+'</span><span>·</span><span>'+fmtH(estH(d))+'</span>':''}</div>

    <div class="fieldlab">Month</div>
    <div class="months">${MONTHS.map((m,i)=>
      `<button class="${bfDraft.month===i+1?'on':''}" onclick="bfPick('month',${i+1})">${m}</button>`).join('')}</div>

    <div class="fieldlab">Airline</div>
    ${knownAls.length?`<div class="chips" style="margin-bottom:8px">${knownAls.slice(0,8).map(al =>
      `<button class="${bfDraft.airline===al?'on':''}" onclick="bfPickS('airline',this)" data-v="${esc(al)}">${esc(al)}</button>`).join('')}</div>`:''}
    <input class="tin" placeholder="Airline…" value="${esc(bfDraft.airline)}" oninput="bfDraft.airline=this.value">

    <div class="fieldlab">Aircraft</div>
    <div class="chips" style="margin-bottom:8px">${AC_QUICK.slice(0,12).map(t =>
      `<button class="${bfDraft.type===t?'on':''}" onclick="bfPickS('type',this)" data-v="${esc(t)}">${t}</button>`).join('')}</div>
    <input class="tin" placeholder="Other type…" value="${esc(AC_QUICK.includes(bfDraft.type)?'':bfDraft.type)}" oninput="bfDraft.type=this.value">

    <div class="deckbtns">
      <button class="btn ghost" onclick="bfNav(-1)" ${bfIdx===0?'disabled':''}>‹</button>
      <button class="btn ghost" onclick="bfNav(1)" ${bfIdx>=q.length-1?'disabled':''}>Skip ›</button>
      <button class="btn primary" onclick="bfSave()">Save & next</button>
    </div>
  </div></div>`;
  document.getElementById('page-backfill').innerHTML = html;
}
function bfPick(k, v){ bfDraft[k] = bfDraft[k]===v ? null : v; renderBackfill(); }
function bfPickS(k, el){ const v = el.dataset.v; bfDraft[k] = bfDraft[k]===v ? '' : v; renderBackfill(); }
function bfNav(dir){ const q = bfQueue(); bfIdx = Math.max(0, Math.min(q.length-1, bfIdx+dir)); bfDraft=null; bfDraftId=null; renderBackfill(); }
function bfSave(){
  const q = bfQueue(); const f = q[bfIdx]; if(!f) return;
  f.month = bfDraft.month || null;
  f.airline = (bfDraft.airline||'').trim();
  f.type = (bfDraft.type||'').trim();
  bfDraft = null; bfDraftId = null;
  persist(); updateYearbar();
  const nq = bfQueue();
  if(nq[bfIdx] && nq[bfIdx].id === f.id) bfIdx = Math.min(nq.length-1, bfIdx+1); // still incomplete → move on
  renderBackfill();
}

/* ================= EDITOR / ADD SHEETS ================= */
const sheetbg = document.getElementById('sheetbg'), sheet = document.getElementById('sheet');
sheetbg.addEventListener('click', e => { if(e.target===sheetbg) closeSheet(); });
sheet.addEventListener('click', e => {            // tap outside an airport field → close its dropdown
  if(!e.target.closest('.acwrap'))
    sheet.querySelectorAll('.aclist').forEach(l => l.style.display='none');
});
function closeSheet(){ sheetbg.classList.remove('on'); sheet.innerHTML=''; }

/* --- airport autocomplete --- */
function apLabel(code){ const a = ap(code); return a ? `${esc(a[3])} (${a[0]})` : (code||''); }
function airportField(id, code){
  return `<div class="acwrap">
    <input class="tin" id="${id}" data-iata="${esc(code||'')}" value="${esc(code?apLabel(code):'')}"
      placeholder="City, airport or code" autocomplete="off"
      oninput="acSearch('${id}')" onfocus="this.select();acSearch('${id}')">
    <div class="aclist" id="${id}-list" style="display:none"></div>
    <div class="aphint" id="${id}-hint">${code&&ap(code)?esc(ap(code)[5]||'')+(ap(code)[4]?' · '+esc(ap(code)[4]):''):''}</div>
  </div>`;
}
function acSearch(id){
  const inp = document.getElementById(id), list = document.getElementById(id+'-list'), hint = document.getElementById(id+'-hint');
  inp.dataset.iata = '';
  hint.textContent = ''; hint.className = 'aphint';
  const q = inp.value;
  const res = searchAp(q);
  if(!q.trim() || !res.length){
    list.style.display = 'none';
    if(q.trim().length >= 3 && !res.length){ hint.textContent = 'No match — add it manually below'; hint.className='aphint bad';
      const c = document.getElementById('customap'); if(c) c.style.display='block'; }
    return;
  }
  list.innerHTML = res.map(a =>
    `<button onclick="acPick('${id}','${a[0]}')">
      <div class="ac-main"><span class="mono">${a[0]}</span> ${esc(a[3])}${a[5]&&a[5]!==a[3]?' · '+esc(a[5]):''}</div>
      <div class="ac-sub">${esc(a[4])}</div></button>`).join('');
  list.style.display = 'block';
}
function acPick(id, code){
  const inp = document.getElementById(id);
  inp.value = apLabel(code); inp.dataset.iata = code;
  document.getElementById(id+'-list').style.display = 'none';
  const a = ap(code), hint = document.getElementById(id+'-hint');
  hint.textContent = (a[5]?a[5]+' · ':'') + a[4]; hint.className = 'aphint good';
}
function readAp(id){
  const inp = document.getElementById(id);
  if(inp.dataset.iata) return inp.dataset.iata;
  const raw = inp.value.trim().toUpperCase();
  if(raw.length===3 && ap(raw)) return raw;          // typed a bare code
  const m = raw.match(/\(([A-Z]{3})\)/); if(m && ap(m[1])) return m[1];
  const res = searchAp(inp.value); if(res.length===1) return res[0][0];
  return null;
}

function sheetForm(f, isNew){
  const ftIds = firstTypeIds();
  const yearsOpts = (() => { const y0 = new Date().getFullYear(); let o='';
    for(let y=y0; y>=1980; y--) o += `<option ${f.year===y?'selected':''}>${y}</option>`; return o; })();
  return `<div class="grab"></div>
  <div class="sh-title">${isNew?'Add flight':'<span class="mono">'+f.from+' → '+f.to+'</span>'}
    ${!isNew && ftIds.has(f.id) ? '<span class="badge">1st on type</span>':''}</div>
  <div class="formrow two" style="grid-template-columns:1fr auto 1fr;align-items:start">
    <div><div class="fieldlab" style="margin-top:0">From</div>${airportField('e-from', f.from)}</div>
    <button class="swapbtn" style="margin-top:26px" onclick="swapAp()">⇄</button>
    <div><div class="fieldlab" style="margin-top:0">To</div>${airportField('e-to', f.to)}</div>
  </div>
  <div id="customap" style="display:none">
    <div class="dz">Airport not in the database? Add it:<div class="formrow two">
      <input class="tin" id="c-iata" maxlength="3" placeholder="Code" style="text-transform:uppercase">
      <input class="tin" id="c-city" placeholder="City"></div>
      <div class="formrow two"><input class="tin" id="c-lat" placeholder="Latitude" inputmode="decimal">
      <input class="tin" id="c-lon" placeholder="Longitude" inputmode="decimal"></div>
      <div class="formrow"><input class="tin" id="c-country" placeholder="Country">
      <button class="btn ghost" style="margin-top:8px;width:100%" onclick="saveCustomAp()">Save airport</button></div></div>
  </div>
  <div class="formrow two">
    <div><div class="fieldlab" style="margin-top:0">Year</div><select class="tin" id="e-year">${yearsOpts}</select></div>
    <div><div class="fieldlab" style="margin-top:0">Month</div><select class="tin" id="e-month">
      <option value="">Not set</option>${MONTHS.map((m,i)=>`<option value="${i+1}" ${f.month===i+1?'selected':''}>${m}</option>`).join('')}</select></div>
  </div>
  <div class="formrow"><div class="fieldlab" style="margin-top:0">Airline</div>
    <input class="tin" id="e-airline" list="dl-airlines" value="${esc(f.airline)}" placeholder="e.g. KLM"></div>
  <div class="formrow"><div class="fieldlab" style="margin-top:0">Aircraft type</div>
    <input class="tin" id="e-type" list="dl-types" value="${esc(f.type)}" placeholder="e.g. A320"></div>
  <div class="formrow two">
    <div><div class="fieldlab" style="margin-top:0">Seat</div><input class="tin" id="e-seat" value="${esc(f.seat)}" placeholder="14A"></div>
    <div><div class="fieldlab" style="margin-top:0">Class</div><select class="tin" id="e-cls">
      <option value="">—</option>${CLASSES.map(c=>`<option ${f.cls===c?'selected':''}>${c}</option>`).join('')}</select></div>
  </div>
  <div class="formrow"><div class="fieldlab" style="margin-top:0">Notes</div>
    <textarea class="tin" id="e-notes" style="min-height:64px" placeholder="Anything worth remembering…">${esc(f.notes)}</textarea></div>
  <datalist id="dl-airlines">${airlinesKnown().map(a=>`<option>${esc(a)}</option>`).join('')}</datalist>
  <datalist id="dl-types">${typesKnown().map(t=>`<option>${esc(t)}</option>`).join('')}</datalist>
  <div class="deckbtns">
    ${isNew?'':'<button class="btn danger" onclick="deleteFlight(\''+f.id+'\')">Delete</button>'}
    <button class="btn primary" onclick="saveFlight('${isNew?'':f.id}')">${isNew?'Add flight':'Save'}</button>
  </div>`;
}
function swapAp(){
  const a=document.getElementById('e-from'), b=document.getElementById('e-to');
  [a.value, b.value] = [b.value, a.value];
  [a.dataset.iata, b.dataset.iata] = [b.dataset.iata, a.dataset.iata];
}
function saveCustomAp(){
  const i = document.getElementById('c-iata').value.trim().toUpperCase();
  const lat = parseFloat(document.getElementById('c-lat').value), lon = parseFloat(document.getElementById('c-lon').value);
  if(i.length!==3 || isNaN(lat) || isNaN(lon)) { alert('Need a 3-letter code plus latitude and longitude.'); return; }
  customAirports[i] = [i, lat, lon, document.getElementById('c-city').value||i, document.getElementById('c-country').value||'', ''];
  persist();
  document.getElementById('customap').style.display='none';
  for(const id of ['e-from','e-to']){               // fill whichever field couldn't resolve
    const inp = document.getElementById(id);
    if(inp && !inp.dataset.iata && !readAp(id)){ acPick(id, i); break; }
  }
}
function openEditor(id){
  const f = flights.find(x=>x.id===id); if(!f) return;
  sheet.innerHTML = sheetForm(f, false); sheetbg.classList.add('on');
}
function openAdd(){
  sheet.innerHTML = sheetForm({from:'',to:'',year:new Date().getFullYear(),month:null,airline:'',type:'',seat:'',cls:'',notes:''}, true);
  sheetbg.classList.add('on');
}
function saveFlight(id){
  const from = readAp('e-from'), to = readAp('e-to');
  if(!from || !to){ alert('Pick both airports from the suggestions (or add unknown ones manually).'); return; }
  const data = {
    from, to,
    year: +document.getElementById('e-year').value,
    month: document.getElementById('e-month').value ? +document.getElementById('e-month').value : null,
    airline: document.getElementById('e-airline').value.trim(),
    type: document.getElementById('e-type').value.trim(),
    seat: document.getElementById('e-seat').value.trim(),
    cls: document.getElementById('e-cls').value,
    notes: document.getElementById('e-notes').value.trim()
  };
  if(id){ Object.assign(flights.find(x=>x.id===id), data, {demo:false}); }
  else flights.push({id:uid(), ...data});
  persist(); closeSheet(); renderAll();
}
function deleteFlight(id){
  if(!confirm('Delete this flight?')) return;
  flights = flights.filter(x=>x.id!==id);
  persist(); closeSheet(); renderAll();
}
/* ================= DATA PAGE ================= */
function csvOf(){
  const head = 'from,to,year,month,airline,type,seat,class,notes';
  const q = s => /[",\n]/.test(s||'') ? '"'+String(s).replace(/"/g,'""')+'"' : (s||'');
  return head + '\n' + flights.map(f =>
    [f.from,f.to,f.year,f.month||'',q(f.airline),q(f.type),q(f.seat),q(f.cls),q(f.notes)].join(',')).join('\n');
}
function download(name, text, mime){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:mime}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
function parseCSV(text){
  const rows = []; let row=[], cell='', inQ=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else inQ=false; } else cell+=c; }
    else if(c==='"') inQ=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cell); cell=''; if(row.some(x=>x!=='')) rows.push(row); row=[]; }
    else cell+=c; }
  if(cell!==''||row.length){ row.push(cell); if(row.some(x=>x!=='')) rows.push(row); }
  return rows;
}
function importText(text){
  text = text.trim(); if(!text) return alert('Nothing to import.');
  let added = 0, skipped = 0;
  try{
    if(text[0]==='[' || text[0]==='{'){
      const arr = JSON.parse(text); const list = Array.isArray(arr) ? arr : arr.flights;
      if(!Array.isArray(arr) && arr.customAirports) Object.assign(customAirports, arr.customAirports);
      for(const r of list){
        const from=(r.from||'').toUpperCase(), to=(r.to||'').toUpperCase(), year=+r.year;
        if(from.length!==3||to.length!==3||!year){ skipped++; continue; }
        flights.push({id:uid(), from, to, year, month:r.month?+r.month:null,
          airline:r.airline||'', type:r.type||'', seat:r.seat||'', cls:r.cls||r.class||'', notes:r.notes||''});
        added++;
      }
    } else {
      const rows = parseCSV(text);
      let start = 0, idx = {from:0,to:1,year:2,month:3,airline:4,type:5,seat:6,class:7,notes:8};
      const h = rows[0].map(x=>x.trim().toLowerCase());
      if(h.includes('from') && h.includes('to')){
        start = 1; idx = {}; ['from','to','year','month','airline','type','seat','class','notes'].forEach(k=>idx[k]=h.indexOf(k));
      }
      for(let i=start;i<rows.length;i++){ const r=rows[i];
        const g = k => idx[k]>=0 ? (r[idx[k]]||'').trim() : '';
        const from=g('from').toUpperCase(), to=g('to').toUpperCase(), year=+g('year');
        if(from.length!==3||to.length!==3||!year){ skipped++; continue; }
        const mRaw = g('month'); let month = null;
        if(mRaw){ const mi = MONTHS.findIndex(m=>m.toLowerCase()===mRaw.slice(0,3).toLowerCase());
          month = mi>=0 ? mi+1 : (+mRaw>=1 && +mRaw<=12 ? +mRaw : null); }
        flights.push({id:uid(), from, to, year, month, airline:g('airline'), type:g('type'), seat:g('seat'), cls:g('class'), notes:g('notes')});
        added++;
      }
    }
  }catch(e){ return alert('Could not parse that. Use CSV with header (from,to,year,month,…) or a JSON array.'); }
  const unknown = [...new Set(flights.flatMap(f=>[f.from,f.to]).filter(c=>!ap(c)))];
  persist(); renderAll();
  alert(`Imported ${added} flight${added!==1?'s':''}.` + (skipped?` Skipped ${skipped} invalid row${skipped!==1?'s':''}.`:'')
    + (unknown.length?`\nUnknown airport codes: ${unknown.join(', ')} — add them via any flight's editor.`:''));
}
function renderData(){
  const demoN = flights.filter(f=>f.demo).length;
  document.getElementById('page-data').innerHTML = `
  <div class="h1">Data</div>
  ${storageOK ? '' : `<div class="card" style="background:var(--accent2);color:var(--accent);font-size:13px;line-height:1.5">Browser storage isn't available in this preview, so changes live in memory only. Download the file and open it locally (or export JSON) to keep your edits.</div>`}
  <div class="card">
    <div class="sh-title" style="font-size:15px">Export</div>
    <div class="deckbtns">
      <button class="btn ghost" onclick="download('flightdeck.json', JSON.stringify({flights,customAirports},null,1), 'application/json')">JSON</button>
      <button class="btn ghost" onclick="download('flightdeck.csv', csvOf(), 'text/csv')">CSV</button>
    </div>
  </div>
  <div class="card">
    <div class="sh-title" style="font-size:15px">Import</div>
    <div class="formrow"><textarea class="tin" id="imp" placeholder="Paste CSV (from,to,year,month,airline,type,seat,class,notes) or JSON…"></textarea></div>
    <div class="deckbtns">
      <label class="btn ghost" style="cursor:pointer">Choose file<input type="file" accept=".csv,.json,.txt" style="display:none" onchange="this.files[0]&&this.files[0].text().then(importText)"></label>
      <button class="btn primary" onclick="importText(document.getElementById('imp').value)">Import pasted</button>
    </div>
    <div class="dz" style="margin-top:12px">Minimal row: <span class="mono">AMS,OTP,2019</span> — month and the rest are optional, backfill later in the app.</div>
  </div>
  <div class="card">
    <div class="sh-title" style="font-size:15px">Housekeeping</div>
    <div class="deckbtns">
      ${demoN?`<button class="btn ghost" onclick="clearDemo()">Remove ${demoN} demo flights</button>`:''}
      <button class="btn danger" onclick="wipeAll()">Erase everything</button>
    </div>
  </div>
  <div style="text-align:center;color:var(--muted);font-size:11.5px;padding:4px 0 14px">
    ${AIRPORTS_RAW.length.toLocaleString()} airports on board · data stays on this device</div>`;
}
function clearDemo(){ flights = flights.filter(f=>!f.demo); persist(); renderAll(); }
function wipeAll(){ if(!confirm('Erase all flights and custom airports?')) return;
  flights=[]; customAirports={}; persist(); renderAll(); }

/* ================= SHELL ================= */
function updateYearbar(){
  const ys = yearsList();
  const unallocByY = {}; for(const f of flights) if(!f.month) unallocByY[f.year]=(unallocByY[f.year]||0)+1;
  const totalUn = Object.values(unallocByY).reduce((a,b)=>a+b,0);
  document.getElementById('yearbar').innerHTML =
    `<button class="chip ${yearSel==='all'?'on':''}" onclick="setYear('all')">All${totalUn?` <span class="dot">${totalUn}</span>`:''}</button>` +
    ys.map(y=>`<button class="chip ${yearSel===y?'on':''}" onclick="setYear(${y})">${y}${unallocByY[y]?` <span class="dot">${unallocByY[y]}</span>`:''}</button>`).join('');
}
function setYear(y){ yearSel = y; bfIdx = 0; bfDraft = {}; renderAll(true); }
function renderAll(animateMap){
  updateYearbar();
  if(tab==='map'){ drawMap(animateMap); bindMapInteractions(); }
  if(tab==='stats') renderStats();
  if(tab==='flights') renderFlights();
  if(tab==='backfill') renderBackfill();
  if(tab==='data') renderData();
}
document.getElementById('tabbar').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  tab = b.dataset.t;
  document.querySelectorAll('.tabbar button').forEach(x=>x.classList.toggle('on', x===b));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on', p.id==='page-'+tab));
  renderAll(tab==='map');
});
document.getElementById('viewseg').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.v !== mapMode) resetZoomState();
  mapMode = b.dataset.v;
  document.querySelectorAll('#viewseg button').forEach(x=>x.classList.toggle('on', x===b));
  if(tab!=='map'){ tab='map';
    document.querySelectorAll('.tabbar button').forEach(x=>x.classList.toggle('on', x.dataset.t==='map'));
    document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on', p.id==='page-map')); }
  drawMap(true); bindMapInteractions();
});
document.getElementById('unitbtn').addEventListener('click', () => {
  unit = unit==='km' ? 'mi' : unit==='mi' ? 'nm' : 'km';
  document.getElementById('unitbtn').textContent = unit;
  persist(); renderAll(false);
});
document.getElementById('unitbtn').textContent = unit;

function applyTheme(){
  document.documentElement.dataset.theme = theme;
  document.getElementById('themebtn').textContent = theme === 'dark' ? '☀' : '☾';
}
document.getElementById('themebtn').addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  applyTheme(); persist();
});
applyTheme();

renderAll(true);
</script>
